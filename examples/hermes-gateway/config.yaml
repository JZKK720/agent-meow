spec_version: 1
name: hermes-gateway
description: >-
  Delegate to a local Hermes agent gateway. Hermes runs independently on the
  same machine as an OpenAI-compatible API server (port 8642). This agent
  forwards user requests to the Hermes gateway, which handles tools, memory,
  skills, and terminal access locally. No hermes code is vendored — the
  gateway is reached over HTTP.

executor:
  type: agent-meow
  config:
    harness: openai-agents
  model: hermes-agent
  # Hermes forwards to deepseek-v4-flash (1M context per Ollama model info),
  # but only reports the opaque id "hermes-agent" — without this override
  # agent-meow falls to the 128K default and compacts 8x too early.
  context_window: 1048576
  auth:
    type: api_key
    # API key and base URL are resolved from the environment at runtime:
    # HERMES_API_KEY (set in .env / compose) and the Hermes gateway URL.
    # In the all-in-one compose, Hermes is at http://hermes-gateway:8642/v1.
    # On a host with a standalone Hermes, use http://host.docker.internal:8642/v1.
    api_key: ${HERMES_API_KEY}
    base_url: ${HERMES_BASE_URL:-http://hermes-gateway:8642/v1}

# Hermes is a full agent with its own tool loop (write_file, skill_view,
# terminal, etc.). It handles tools internally — the response from
# /v1/chat/completions already contains tool results, not tool_calls.
# Suppressing builtins prevents the openai-agents harness from registering
# agent-meow's own tools, which would conflict with Hermes's tools and
# cause "Tool skill_view not found in agent agent-meow" errors.
tools:
  builtins: []

prompt: |
  You are a delegate agent connected to a local Hermes agent gateway.
  The Hermes gateway handles tool execution, memory, skills, and terminal
  access on the host machine. Forward user requests to the gateway and
  return its responses. When the user asks about tools or capabilities,
  explain that hermes-agent manages those locally.

interaction:
  modalities:
    input: [text, image, file]
    output: [text]