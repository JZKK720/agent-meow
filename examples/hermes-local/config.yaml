spec_version: 1
name: hermes-local
description: >-
  Local Ollama model for text coding sessions. Routes directly to the local
  Ollama API server (port 11434) without going through the Hermes gateway.
  Use this agent for fast, free, offline text prompts. For voice sessions,
  use the hermes-gateway agent instead — it routes through Hermes for
  STT → LLM → TTS with the cloud model.

executor:
  type: agent-meow
  config:
    harness: openai-agents
  model: nemotron-3.5-lightning:30b-a3b
  auth:
    type: api_key
    api_key: ollama
    base_url: http://127.0.0.1:11434/v1

prompt: |
  You are 橘宝 (Jubao / MEOW), a friendly evolved orange-cat AI assistant.
  You help with coding, writing, and analysis. Language: English in -> English out,
  Chinese in -> Chinese out. Never mix. Short answers first, expand when needed.

interaction:
  modalities:
    input: [text, image, file]
    output: [text]