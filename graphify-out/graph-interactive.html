  nodes: { borderWidth: 1, shadow: true },
  edges: { width: 0.5, smooth: { type: 'continuous' } },
  physics: {

  interaction: { hover: true, tooltipDelay: 200, navigationButtons: true, keyboard: true },
};

var network = new vis.Network(container, data, options);
var physicsOn = true;

function togglePhysics() {
  physicsOn = !physicsOn;
  network.setOptions({ physics: physicsOn });
}

      '<div class="field"><span class="label">ID:</span> <span class="value">' + nodeId + '</span></div>' +
      '<div class="field"><span class="label">Community:</span> <span class="value">' + node.group + '</span></div>' +
      '<div class="field"><span class="label">Connections:</span> <span class="value">' + connected.length + '</span></div>' +
      '<div class="field"><span class="label">Edges:</span> <span class="value">' + connectedEdges.length + '</span></div>';
    panel.style.display = 'block';
  } else {
    document.getElementById('info-panel').style.display = 'none';
  }
});

var communities = {};
nodes.forEach(function(n) {
  if (!communities[n.group]) communities[n.group] = 0;
  communities[n.group]++;
});
var select = document.getElementById('community-filter');
Object.keys(communities).sort(function(a,b){return a-b;}).forEach(function(c) {
  var opt = document.createElement('option');
  opt.value = c;
  opt.text = 'Community ' + c + ' (' + communities[c] + ' nodes)';
  select.appendChild(opt);
});

function filterCommunity() {
  var val = document.getElementById('community-filter').value;
  if (val === '-1') {
    nodes.forEach(function(n) { nodes.update({id: n.id, hidden: false}); });
  } else {
    nodes.forEach(function(n) {
      nodes.update({id: n.id, hidden: n.group != parseInt(val)});
    });
  }
}

function searchNodes() {
  var query = document.getElementById('search-input').value.toLowerCase();
  if (!query) {
    nodes.forEach(function(n) {
      nodes.update({id: n.id, color: n._origColor || n.color});
    });
    return;
  }
  // Store original colors on first search
  nodes.forEach(function(n) {
    if (!n._origColor) nodes.update({id: n.id, _origColor: n.color});
    var label = (n.label || '').toLowerCase();
    if (label.includes(query)) {
      nodes.update({id: n.id, color: {background: '#ffeb3b', border: '#f57f17', font: {color: '#000', size: 14}}});
    } else {
      nodes.update({id: n.id, color: {background: '#444', border: '#333', font: {color: '#666'}}});
    }
  });
}

network.once('stabilizationIterationsDone', function() {
  document.getElementById('stats').innerHTML += ' | <span style="color:#6c63ff">Ready</span>';
});
</script>
</body>
</html>
