[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-meow-ui-sdk"
version = "0.11.1"
description = "Terminal UI components (Rich + prompt_toolkit) for building agent-meow frontends"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Version-locked (==) with the sibling client SDK; released together
    # at one version (release-omnigent.yml verifies the pin). A `>=`
    # floor would also reject pre-releases (e.g. 0.1.0rc1 < 0.1.0 in
    # PEP 440).
    "agent-meow-client==0.11.1",
    "rich>=13",
    "prompt_toolkit>=3",
    "pyyaml>=6.0,<7",
]

# The importable module directory is `agent_meow_ui_sdk/`.
[tool.hatch.build.targets.wheel]
packages = ["agent_meow_ui_sdk"]
