_config_version: 34
agent:
  max_turns: 60
  reasoning_effort: none
  system_prompt: 'I am 橘宝 (Jubao / MEOW), a friendly evolved orange-cat AI assistant.
    I am NOT Hermes or Qwen. Hermes Agent is my platform, not my name. Language: English
    in -> English out, Chinese in -> Chinese out. Never mix. I generate copy, documents,
    code, images. I manage local files. I control the system via voice. I stay in
    character as 橘宝 always. Professional with cat humor. Short answers first, expand
    when needed.'
  verbose: false
  verify_on_stop: false
auxiliary:
  compression:
    model: ornith:9b-q8_0
    provider: main
code_execution:
  max_tool_calls: 50
  timeout: 300
compression:
  enabled: true
  protect_last_n: 20
  target_ratio: 0.2
  threshold: 0.5
dashboard:
  basic_auth:
    password_hash: scrypt$16384$8$1$QJMs7wfRIelUP6tXKnzgTg==$d4nrKch8xCpKe5pV5hGK5S+CnJrLLF8idO56e58Tlhw=
    secret: 28765d337208aa3c0b6671cb1969e8cad9c22d7b7967b21628765d337208aa3c
    session_ttl_seconds: 86400
    username: admin
delegation:
  default_toolsets:
    - terminal
    - file
    - web
  max_iterations: 50
display:
  background_process_notifications: result
  show_reasoning: false
  skin: default
  streaming: true
  tool_progress: all
memory:
  flush_min_turns: 6
  memory_char_limit: 2200
  memory_enabled: true
  nudge_interval: 10
  user_char_limit: 1375
  user_profile_enabled: true
model:
  base_url: http://host.docker.internal:11434/v1
  default: deepseek-v4-flash:0731-cloud
  provider: custom
platforms:
  webhook:
    enabled: true
    extra:
      host: 0.0.0.0
      port: 8644
  weixin:
    enabled: true
    extra:
      base_url: https://ilinkai.weixin.qq.com
      dm_policy: open
      group_policy: disabled
plugins:
  enabled: []
session_reset:
  at_hour: 4
  idle_minutes: 1440
  mode: both
stt:
  enabled: true
  provider: local
  local:
    model: base
  # language removed — let Whisper auto-detect from audio
tts:
  provider: edge
  edge:
    voice: zh-CN-XiaoxiaoNeural
  providers:
    qwen-offline:
      type: command
      command: 'python3 -c "import sys, json, urllib.request; text = open(sys.argv[1]).read();
        data = json.dumps(dict(text=text, language=''Auto'', speaker=''Serena'')).encode();
        req = urllib.request.Request(''http://host.docker.internal:8889/tts'',
        data=data, headers={''Content-Type'': ''application/json''}); resp = urllib.request.urlopen(req);
        open(sys.argv[2], ''wb'').write(resp.read())" "{{input_path}}" "{{output_path}}"'
      output_format: wav
      timeout: 120
terminal:
  backend: local
  cwd: /opt/data/workspace
  lifetime_seconds: 300
  timeout: 180

# ── Security ──────────────────────────────────────────────────────────
# Secret redaction is ON by default — strings that look like API keys,
# tokens, and passwords are masked in tool output, logs, and chat
# responses before the model or user ever sees them. Set redact_secrets
# to false to disable (e.g. when developing the redactor itself).
# tirith pre-exec scanning is enabled by default when the tirith binary
# is available. Configure via security.tirith_* keys or env vars
# (TIRITH_ENABLED, TIRITH_BIN, TIRITH_TIMEOUT, TIRITH_FAIL_OPEN).
#
# security:
#   redact_secrets: true
#   tirith_enabled: true
#   tirith_path: "tirith"
#   tirith_timeout: 5
#   tirith_fail_open: true

# ── Fallback Model ────────────────────────────────────────────────────
# Automatic provider failover when primary is unavailable.
# Uncomment and configure to enable. Triggers on rate limits (429),
# overload (529), service errors (503), or connection failures.
#
# Supported providers:
#   openrouter   (OPENROUTER_API_KEY)  — routes to any model
#   openai-codex (OAuth — hermes auth) — OpenAI Codex
#   nous         (OAuth — hermes auth) — Nous Portal
#   zai          (ZAI_API_KEY)         — Z.AI / GLM
#   kimi-coding  (KIMI_API_KEY)        — Kimi / Moonshot
#   kimi-coding-cn (KIMI_CN_API_KEY)   — Kimi / Moonshot (China)
#   minimax      (MINIMAX_API_KEY)     — MiniMax
#   minimax-cn   (MINIMAX_CN_API_KEY)  — MiniMax (China)
#   bedrock      (AWS IAM / boto3)     — AWS Bedrock (Converse API)
#
# For custom OpenAI-compatible endpoints, add base_url and key_env.
#
# fallback_model:
#   provider: openrouter
#   model: anthropic/claude-sonnet-4
