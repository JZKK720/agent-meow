apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agent-meow
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - agent_meow.example.com
      secretName: agent-meow-tls
  rules:
    - host: agent_meow.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agent-meow
                port:
                  name: http
