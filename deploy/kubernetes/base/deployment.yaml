apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-meow
  labels:
    app: agent-meow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-meow
  template:
    metadata:
      labels:
        app: agent-meow
    spec:
      containers:
        - name: agent-meow
          image: ghcr.io/JZKK720/agent-meow-server:latest
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: agent-meow-config
            - secretRef:
                name: agent-meow-secrets
          volumeMounts:
            - name: artifacts
              mountPath: /data/artifacts
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: agent-meow-artifacts
