apiVersion: v1
kind: Secret
metadata:
  name: agent-meow-secrets
  labels:
    app: agent-meow
type: Opaque
stringData:
  # Replace with your actual database connection string.
  DATABASE_URL: "postgresql+psycopg://agent-meow:changeme@your-db-host:5432/agent-meow"
  # Generate with: openssl rand -hex 32
  OMNIGENT_ACCOUNTS_COOKIE_SECRET: "changeme"
