apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-meow
spec:
  template:
    spec:
      serviceAccountName: agent-meow
      containers:
        - name: agent-meow
          volumeMounts:
            - name: openshell-gateway
              mountPath: /home/agent_meow/.config/openshell
              readOnly: true
            - name: server-config
              mountPath: /data/server-config.yaml
              subPath: config.yaml
              readOnly: true
      volumes:
        - name: openshell-gateway
          secret:
            secretName: openshell-gateway-config
            optional: true
        - name: server-config
          configMap:
            name: agent-meow-server-config
