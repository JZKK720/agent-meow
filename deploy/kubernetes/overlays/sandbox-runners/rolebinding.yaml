---
# CROSS-NAMESPACE binding: this RoleBinding lives in the runner namespace
# `agent-meow-sandboxes` and grants the agent-meow-sandbox-manager Role (also in
# `agent-meow-sandboxes`) to the agent-meow-server SA, which lives in the SEPARATE
# server namespace `agent-meow`. A RoleBinding may reference a subject in another
# namespace, so the server gets runner-Pod management rights in
# `agent-meow-sandboxes` ONLY — never in its own namespace. The subject namespace
# is set explicitly (NOT injected) so the binding is unambiguous. The runner SA
# is deliberately absent — runner Pods need no API access.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-meow-sandbox-manager
  namespace: agent-meow-sandboxes
  labels:
    app.kubernetes.io/name: agent-meow
    app.kubernetes.io/component: server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-meow-sandbox-manager
subjects:
  - kind: ServiceAccount
    name: agent-meow-server
    namespace: agent-meow
