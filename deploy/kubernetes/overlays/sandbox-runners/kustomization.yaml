apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# On-demand runner-Pod sandbox provider, layered on the base server deploy.
# Two-namespace split (server in `agent-meow`, runners in `agent-meow-sandboxes`) — see
# README.md. No overlay-wide `namespace:`; each resource sets its own explicitly.

resources:
  - ../../base
  - serviceaccount-server.yaml # SA in agent-meow (server runs as this)
  - namespace-sandboxes.yaml # the dedicated agent-meow-sandboxes namespace
  - serviceaccount-runner.yaml # runner SA in agent-meow-sandboxes
  - role.yaml # Role in agent-meow-sandboxes (scoped Pod + Secret rights)
  - rolebinding.yaml # cross-ns binding: server SA → runner-ns Role
  - sandbox-config.yaml # server config (agent-meow); points at runner ns
# The harness-credentials Secret (sandbox.kubernetes.secret_name, default
# agent-meow-creds) is NOT checked in — create it out of band like the base
# OIDC secret (see README.md "Apply"). Prefer sealed-secrets/external-secrets.

# The base server image lacks the `kubernetes` extra, so a managed launch would
# fail to import the client. Build the server WITH it
# (`--build-arg OMNIGENT_EXTRAS=kubernetes`, see deploy/docker) and set it here.
images:
  - name: ghcr.io/JZKK720/agent-meow-server
    newName: ghcr.io/REPLACE_ME/agent-meow-server
    newTag: kubernetes

patches:
  - path: deployment-patch.yaml
