---
# RBAC for the kubernetes sandbox provider (on-demand runner Pods).
#
# TWO-NAMESPACE, LEAST-BLAST-RADIUS DESIGN: the server, its DB/PVC and its
# Secrets live in `agent-meow`; the runner Pods live in a SEPARATE
# `agent-meow-sandboxes` namespace. The server SA's pods create/get/delete +
# secrets create/delete rights are scoped (via a Role + RoleBinding) to
# `agent-meow-sandboxes` ONLY — so a compromised server can manage RUNNER Pods but
# CANNOT delete the server/DB Pods, read the server's Secrets, nor (because
# there is no pods/exec grant) execute commands inside any Pod.
#
#   agent-meow-server  — the agent-meow server runs as this SA (this file; lives in
#                      `agent-meow`). deployment-patch.yaml sets
#                      serviceAccountName: agent-meow-server. The launcher uses its
#                      in-cluster token to manage runner Pods + their token
#                      Secrets in `agent-meow-sandboxes`.
#   agent-meow-runner  — the runner Pods run as this SA (serviceaccount-runner.yaml,
#                      lives in `agent-meow-sandboxes`); it has NO API rights.
#
# Role (role.yaml) + RoleBinding (rolebinding.yaml) live in `agent-meow-sandboxes`;
# the RoleBinding subject is the agent-meow-server SA in `agent-meow` (a
# cross-namespace binding — see rolebinding.yaml). Scope is a namespaced Role
# (NOT a ClusterRole) so the grant can never reach beyond the runner namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-meow-server
  namespace: agent-meow
  labels:
    app.kubernetes.io/name: agent-meow
    app.kubernetes.io/component: server
