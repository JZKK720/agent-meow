<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';">
  <link rel="stylesheet" href="wizard.css">
  <title>agent-meow Setup</title>
</head>
<body>
  <div id="wizard">
    <div class="header">
      <img src="../../icons/wizard-logo.png" alt="agent-meow" class="logo" onerror="this.style.display='none'">
      <h1>Welcome to agent-meow</h1>
      <p>Let's set up your AI assistant. This takes 5–15 min depending on model size.</p>
    </div>

    <div class="steps-indicator" id="steps-indicator"></div>

    <div id="step-content">
      <h2 id="step-title">Detecting your hardware</h2>
      <div id="step-detail"></div>
    </div>

    <div class="progress-bar">
      <div id="progress-fill"></div>
    </div>

    <div class="actions">
      <button id="btn-back" class="btn-secondary" style="display:none">Back</button>
      <button id="btn-skip" class="btn-secondary" style="display:none">Skip</button>
      <button id="btn-next" class="btn-primary">Next</button>
    </div>
  </div>
  <script src="wizard.js"></script>
</body>
</html>
